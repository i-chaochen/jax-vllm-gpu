#
# The paged KV control plane (kv.common and kv.control) imports only the
# standard library and numpy, and tests/test_kv_import_rule.py keeps it that
# way, so its tests run on a hosted runner with nothing else installed. The
# plugin, the engine and the kernels need the ROCm JAX stack, vLLM and MaxText;
# docs/getting_started.md runs those.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  control-plane-tests:
    name: Control-plane tests (CPU, numpy only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install numpy and pytest
        run: python -m pip install numpy pytest
      - name: Run the control-plane tests
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest
          tests/test_kv_common.py
          tests/test_kv_control.py
          tests/test_kv_import_rule.py
          tests/test_kv_prefix_cache.py
          tests/test_kv_residency.py
          tests/test_agent_skills.py
